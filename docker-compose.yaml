

services:
  catalog-db:
    env_file:
      - catalog-service/.env
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 5

  catalog-service:
    env_file:
      - catalog-service/.env
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      catalog-db:
        condition: service_healthy
volumes:
  postgres_data: